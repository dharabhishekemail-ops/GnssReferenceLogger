plugins {
    id 'com.android.application'
}

android {
    namespace 'com.harman.gnssref'
    compileSdk 34

    defaultConfig {
        applicationId 'com.harman.gnssref'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Unsigned release is not installable; the debug APK is the one teammates install.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // AndroidX pulls in two Kotlin stdlib versions; the BOM aligns them (the app itself is plain Java).
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    testImplementation 'junit:junit:4.13.2'
}
